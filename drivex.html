<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DriveX – Car rental across India</title>
<meta name="description" content="DriveX: rent hatchbacks, sedans, SUVs and luxury cars in Pune, Mumbai, Bengaluru, Delhi, Hyderabad and Chennai. Demo application.">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14203a;--mut:#5b6679;--bg:#f5f6f8;--card:#fff;--line:#e2e6ec;--ac:#0f766e;--ac2:#0b5a54;--warn:#b45309;--bad:#b91c1c;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e8ecf3;--mut:#9aa6ba;--bg:#0e1526;--card:#172038;--line:#2a3550;--ac:#2dd4bf;--ac2:#5eead4}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Sora,Inter,sans-serif;letter-spacing:-.01em;margin:0}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1200px;margin:0 auto;padding:0 16px}.sec{padding:36px 0}.sec h2{font-size:24px;margin-bottom:16px}
nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
nav .w{display:flex;align-items:center;gap:20px;height:60px}.logo{font-size:22px;font-weight:700}.logo b{color:var(--ac)}
.nl{display:flex;gap:16px;flex:1}.nl a,.nr a{padding:6px 2px;color:var(--mut);font-weight:500}.nl a:hover,.nr a:hover{color:var(--ink)}
.nr{display:flex;gap:14px;align-items:center}.burger{display:none}
@media(max-width:900px){.burger{display:block;margin-left:auto}.nl,.nr{display:none;position:absolute;top:60px;left:0;right:0;background:var(--card);flex-direction:column;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}.nr{top:auto}nav.open .nl,nav.open .nr{display:flex}nav.open .nl{position:static}nav.open .w{flex-wrap:wrap;height:auto;padding-bottom:8px;min-height:60px}nav.open .nl,nav.open .nr{width:100%;position:static;border:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;font:600 14px Inter;cursor:pointer}.btn:hover{background:var(--ac2)}.btn.o{background:transparent;color:var(--ac)}.btn.o:hover{background:rgba(15,118,110,.08)}.btn.r{border-color:var(--bad);background:transparent;color:var(--bad)}.btn.s{min-height:32px;padding:0 10px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.pad{padding:16px}
input,select,textarea{width:100%;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}.f{margin-bottom:12px}.er{color:var(--bad);font-size:12px}
.g{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.hero{background:#14203a;color:#fff;padding:48px 0 90px}.hero h1{font-size:clamp(30px,5vw,52px);max-width:640px;line-height:1.1}.hero p{color:#b8c4da;max-width:520px}
.sf{margin-top:-60px;padding:16px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px;align-items:end;box-shadow:0 10px 30px rgba(20,32,58,.12)}
@media(max-width:900px){.sf{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.sf{grid-template-columns:1fr}}
.vc{overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s}.vc:hover{box-shadow:0 8px 24px rgba(20,32,58,.12)}
.vc .im{position:relative;overflow:hidden}.vc img{width:100%;display:block;transition:transform .3s}.vc:hover img{transform:scale(1.04)}
.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#94a3b8;font-size:18px;cursor:pointer}.heart.on{color:#e11d48}.heart:active{transform:scale(1.25)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(15,118,110,.12);color:var(--ac)}.tag.bad{background:#fee2e2;color:var(--bad)}.tag.warn{background:#fef3c7;color:var(--warn)}.tag.ok{background:#dcfce7;color:var(--ok)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mut);font-size:13px}.price{font:700 20px Sora}.price small{font:400 12px Inter;color:var(--mut)}
.lay{display:grid;grid-template-columns:260px 1fr;gap:20px}.lay.d{grid-template-columns:1fr 360px;align-items:start}.stick{position:sticky;top:76px}
@media(max-width:900px){.lay,.lay.d{grid-template-columns:1fr}.stick{position:static}#fp{display:none}#fp.show{display:block}}@media(min-width:901px){#ft{display:none}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:12px}.tw{overflow-x:auto}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.steps span{flex:1;min-width:70px;padding:6px;text-align:center;border-bottom:3px solid var(--line);font-size:12px;color:var(--mut)}.steps .on{border-color:var(--ac);color:var(--ink);font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0}.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;font-size:17px}
.mod{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.mod>div{max-height:90vh;overflow:auto;width:min(560px,100%)}
#toast{position:fixed;bottom:16px;right:16px;z-index:60;display:grid;gap:8px}#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px}
.adm{display:grid;grid-template-columns:200px 1fr;gap:20px}.adm aside a{display:block;padding:9px 12px;border-radius:8px;color:var(--mut);font-weight:500}.adm aside a.on{background:rgba(15,118,110,.12);color:var(--ac)}
@media(max-width:800px){.adm{grid-template-columns:1fr}.adm aside{display:flex;gap:4px;overflow-x:auto}}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar i{display:block;height:14px;background:var(--ac);border-radius:4px;min-width:2px}.bar span:first-child{width:110px;flex:none}
footer{background:#14203a;color:#b8c4da;padding:32px 0;margin-top:40px;font-size:14px}footer a{display:block;padding:2px 0}
details{padding:12px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:600}
.sk{background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;height:280px}@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><footer id="ft2"></footer><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),M=n=>'₹'+Math.round(n).toLocaleString('en-IN'),uid=()=>Math.random().toString(36).slice(2,8);
const LS=(k,d)=>{try{const x=JSON.parse(localStorage.getItem('dx'+k));return x??d}catch{return d}};
const CITIES=['Pune','Mumbai','Bengaluru','Delhi','Hyderabad','Chennai'],CATS=['Hatchback','Sedan','SUV','Luxury'];
const FEAT=['Bluetooth','GPS','USB','Parking sensors','Reverse camera','Cruise control','Air conditioning'];
const ADD=[['GPS navigation',350],['Child seat',400],['Additional driver',600],['Insurance upgrade',700],['Roadside assistance',300]];
const INS=500,TAX=.18;
const iso=d=>{const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
const seedV=()=>[['Maruti Suzuki','Swift',2023,'Hatchback',1800,'Petrol','Manual',5,22,'Pune',4.4,312,210,'1.2L K-Series'],['Hyundai','Creta',2023,'SUV',3200,'Diesel','Automatic',5,17,'Mumbai',4.6,540,20,'1.5L CRDi'],['Tata','Nexon',2023,'SUV',2700,'Petrol','Manual',5,17,'Bengaluru',4.5,410,260,'1.2L Turbo'],['Mahindra','Thar',2022,'SUV',3800,'Diesel','Manual',4,15,'Pune',4.7,620,30,'2.2L mHawk'],['Toyota','Fortuner',2022,'SUV',6500,'Diesel','Automatic',7,10,'Delhi',4.8,280,0,'2.8L Diesel'],['Kia','Seltos',2023,'SUV',3300,'Petrol','Automatic',5,16,'Hyderabad',4.5,350,200,'1.5L Turbo'],['Hyundai','Verna',2023,'Sedan',2600,'Petrol','Automatic',5,18,'Chennai',4.4,220,240,'1.5L MPi'],['Honda','City',2022,'Sedan',2500,'Petrol','Automatic',5,18,'Mumbai',4.5,480,350,'1.5L i-VTEC'],['MG','Hector',2022,'SUV',3500,'Diesel','Manual',5,15,'Delhi',4.2,190,220,'2.0L Diesel'],['BMW','3 Series',2023,'Luxury',9500,'Petrol','Automatic',5,14,'Mumbai',4.8,130,215,'2.0L TwinPower'],['Mercedes-Benz','C-Class',2023,'Luxury',11000,'Petrol','Automatic',5,14,'Bengaluru',4.9,110,225,'2.0L Turbo']].map((r,i)=>({id:'v'+(i+1),brand:r[0],model:r[1],year:r[2],cat:r[3],price:r[4],dep:r[4]*4,fuel:r[5],trans:r[6],seats:r[7],mileage:r[8],loc:r[9],rating:r[10],rc:r[11],hue:r[12],engine:r[13],features:FEAT.filter((_,j)=>j<3||(r[4]+j*7)%3>0||r[3]=='Luxury'),desc:`A well-kept ${r[2]} ${r[0]} ${r[1]} from our ${r[9]} fleet. Serviced regularly, cleaned before every handover and covered by basic insurance. Demo data.`,avail:i!=8,pop:r[11]}));
const seedU=()=>[{id:'u0',name:'DriveX Admin',email:'admin@example.com',pw:'demo1234',phone:'9800000000',addr:'Head Office, Pune',role:'admin'},{id:'u1',name:'Aarav Sharma',email:'customer@example.com',pw:'demo1234',phone:'9812345678',addr:'12 MG Road, Pune',role:'customer'},{id:'u2',name:'Meera Iyer',email:'meera@example.com',pw:'demo1234',phone:'9898989898',addr:'44 Anna Nagar, Chennai',role:'customer'}];
const seedB=V=>[[-70,'u1','v1',3,'Completed'],[-45,'u2','v7',2,'Completed'],[-30,'u1','v4',4,'Completed'],[-12,'u2','v2',3,'Completed'],[-2,'u1','v5',5,'Active'],[6,'u1','v8',3,'Confirmed'],[10,'u2','v10',2,'Pending'],[-20,'u1','v3',2,'Cancelled']].map(([o,c,v,d,s])=>{const car=V.find(x=>x.id==v),p=price(car,d,[]);return{id:'DX'+(100000+Math.floor(Math.random()*899999)),cid:c,vid:v,pl:car.loc,dl:car.loc,pd:iso(o),pt:'10:00',rd:iso(o+d),rt:'10:00',days:d,addons:[],sub:p.rent+p.ins,tax:p.tax,total:p.total,pay:s=='Cancelled'?'Refunded':s=='Pending'?'Pending':'Paid',st:s,at:iso(o-3)}});
const S={V:LS('V',null)||seedV(),U:LS('U',null)||seedU(),F:LS('F',[]),C:LS('C',[]),ME:LS('ME',null)};S.B=LS('B',null)||seedB(S.V);
const sv=()=>{try{for(const k in S)localStorage.setItem('dx'+k,JSON.stringify(S[k]))}catch{}};sv();
function price(v,d,ad){const rent=v.price*d,ins=INS,add=ad.reduce((s,n)=>s+(ADD.find(a=>a[0]==n)||[0,0])[1],0),tax=(rent+ins+add)*TAX;return{rent,ins,add,tax,total:rent+ins+add+tax,dep:v.dep}}
const days=(a,b)=>{const n=Math.ceil((new Date(b)-new Date(a))/864e5);return n>0?n:1};
function car(v,i=0){if(v.img&&i==0)return v.img;const c=`hsl(${v.hue} 40% ${v.hue==0?30:42}%)`,bg=['#e6ecf3','#efe9df','#e0ede8'][i%3],t=v.cat,b=t=='SUV'?'M36 150V112Q40 96 66 92L92 66Q100 58 122 58H262Q282 58 296 80L318 100Q352 104 362 120V150Z':t=='Hatchback'?'M40 150V116Q44 100 74 98L110 66Q118 58 138 58H236Q256 58 268 76L300 100Q346 106 358 122V150Z':'M30 150V118Q34 104 70 100L112 74Q124 64 146 64H236Q258 64 272 80L302 98Q352 104 366 122V150Z';
const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220"><rect width="400" height="220" fill="${bg}"/><rect y="160" width="400" height="60" fill="#0002"/><path d="${b}" fill="${c}"/><path d="M118 96L136 70H232L262 96Z" fill="#dbe7f3" opacity=".85"/><g fill="#1a1f2b"><circle cx="100" cy="152" r="24"/><circle cx="296" cy="152" r="24"/></g><g fill="#cfd6e2"><circle cx="100" cy="152" r="11"/><circle cx="296" cy="152" r="11"/></g><rect x="${340-i*8}" y="118" width="20" height="8" rx="3" fill="#ffe9a8"/><text x="200" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0009">${v.brand} ${v.model}</text></svg>`;return'data:image/svg+xml,'+encodeURIComponent(s)}
const toast=m=>{const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3000)};
const modal=h=>{const m=document.createElement('div');m.className='mod';m.setAttribute('role','dialog');m.innerHTML=`<div class="card pad">${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.append(m)};
const closeM=()=>document.querySelectorAll('.mod').forEach(m=>m.remove());
const ask=(msg,fn)=>{window._ok=()=>{closeM();fn()};modal(`<p>${msg}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn o" onclick="closeM()">Keep</button><button class="btn r" onclick="_ok()">Confirm</button></div>`)};
const stars=r=>`<span title="${r} out of 5" style="color:#d97706">★</span> <b>${r}</b>`;
const me=()=>S.ME&&S.U.find(u=>u.id==S.ME.id);
const Q={pl:'',dl:'',pd:iso(1),pt:'10:00',rd:iso(4),rt:'10:00'};let F={q:'',loc:'',cat:'',fuel:'',tr:'',seats:'',rat:0,max:12000,av:false,sort:'pop'};
const bkv=v=>S.B.filter(b=>b.vid==v.id&&['Active','Confirmed','Pending'].includes(b.st));
function head(t,d){document.title=t+' – DriveX';let m=document.querySelector('meta[name=description]');m.content=d}
function navr(){const u=me(),h=location.hash;$('#nav').innerHTML=`<div class="w"><a class="logo" href="#/">Drive<b>X</b></a><button class="btn o s burger" aria-label="Menu" onclick="$('#nav').classList.toggle('open')">☰ Menu</button><div class="nl">${[['','Home'],['cars','Cars'],['locations','Locations'],['offers','Offers'],['about','About'],['contact','Contact']].map(a=>`<a href="#/${a[0]}">${a[1]}</a>`).join('')}</div><div class="nr"><a href="#/compare">Compare (${S.C.length})</a><a href="#/favorites">♥ ${S.F.length}</a><a href="#/account">My bookings</a>${u?`${u.role=='admin'?'<a href="#/admin">Admin</a>':''}<a href="#/account">${u.name.split(' ')[0]}</a><a href="#/" onclick="S.ME=null;sv()">Logout</a>`:'<a class="btn s" href="#/login">Login</a>'}</div></div>`;
$('#ft2').innerHTML=`<div class="w g g4"><div><div class="logo" style="color:#fff">DriveX</div><p>Demo car rental platform. No real payments or bookings.</p></div><div><a href="#/cars">Browse cars</a><a href="#/offers">Offers</a><a href="#/locations">Locations</a></div><div><a href="#/about">About</a><a href="#/contact">Support</a><a href="#/account">My bookings</a></div><div>support@drivex.example<br>1800-000-0000<br>Daily 8am–10pm</div></div>`}
function tgFav(id){const i=S.F.indexOf(id);i<0?S.F.push(id):S.F.splice(i,1);sv();toast(i<0?'Added to favorites':'Removed from favorites');navr();const r=location.hash.slice(2).split('/')[0];if(r=='favorites')route();else document.querySelectorAll(`[data-h="${id}"]`).forEach(b=>b.classList.toggle('on',i<0))}
function tgCmp(id){const i=S.C.indexOf(id);if(i<0){if(S.C.length>=3)return toast('Compare up to 3 cars');S.C.push(id)}else S.C.splice(i,1);sv();navr();toast(i<0?'Added to compare':'Removed from compare')}
const vc=v=>`<article class="card vc"><div class="im"><a href="#/cars/${v.id}"><img src="${car(v)}" alt="${v.brand} ${v.model} ${v.year}" loading="lazy"></a><button class="heart ${S.F.includes(v.id)?'on':''}" data-h="${v.id}" aria-label="Toggle favorite" onclick="tgFav('${v.id}')">♥</button></div><div class="pad" style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between"><h3 style="font-size:17px">${v.brand} ${v.model}</h3><span>${stars(v.rating)}</span></div><div class="meta"><span>${v.year}</span><span>${v.fuel}</span><span>${v.trans}</span><span>${v.seats} seats</span><span>${v.mileage} km/l</span></div><div class="meta"><span>📍 ${v.loc}</span><span class="tag ${v.avail?'ok':'bad'}">${v.avail?'Available':'Unavailable'}</span></div><div class="price" style="margin-top:auto">${M(v.price)}<small> /day · deposit ${M(v.dep)}</small></div><label style="display:flex;gap:6px;align-items:center;font-weight:400;margin:0"><input type="checkbox" style="width:auto;min-height:0" ${S.C.includes(v.id)?'checked':''} onchange="tgCmp('${v.id}')"> Compare</label><div style="display:flex;gap:8px"><a class="btn o s" href="#/cars/${v.id}" style="flex:1">View details</a>${v.avail?`<a class="btn s" href="#/book/${v.id}" style="flex:1">Rent now</a>`:''}</div></div></article>`;
const opt=(a,sel)=>a.map(x=>`<option ${x==sel?'selected':''}>${x}</option>`).join('');
function sform(){return`<form class="card sf" onsubmit="event.preventDefault();F.loc=Q.pl;location.hash='#/cars'"><div><label for="pl">Pickup location</label><select id="pl" onchange="Q.pl=this.value"><option value="">Any city</option>${opt(CITIES,Q.pl)}</select></div><div><label for="dl">Drop-off location</label><select id="dl" onchange="Q.dl=this.value"><option value="">Same as pickup</option>${opt(CITIES,Q.dl)}</select></div><div><label for="pd">Pickup date</label><input id="pd" type="date" min="${iso(0)}" value="${Q.pd}" onchange="Q.pd=this.value"></div><div><label for="pt">Pickup time</label><input id="pt" type="time" value="${Q.pt}" onchange="Q.pt=this.value"></div><div style="grid-column:span 1"></div><div><label for="rd">Return date</label><input id="rd" type="date" min="${iso(0)}" value="${Q.rd}" onchange="Q.rd=this.value"></div><div><label for="rt">Return time</label><input id="rt" type="time" value="${Q.rt}" onchange="Q.rt=this.value"></div><button class="btn" style="grid-column:span 2">Search cars</button></form>`}
const P={};
P.home=()=>{head('Rent the right car for every journey','Rent hatchbacks, sedans, SUVs and luxury cars across six Indian cities with DriveX.');const top=[...S.V].sort((a,b)=>b.pop-a.pop).slice(0,4),rec=[...S.V].filter(v=>v.avail).sort((a,b)=>b.rating-a.rating).slice(0,4);
return`<section class="hero"><div class="w"><h1>Rent the right car for every journey</h1><p>Pick from a hand-checked fleet in six cities. Transparent pricing, flexible pickup, no hidden fees.</p></div></section><div class="w">${sform()}</div>
<div class="w sec"><h2>Popular cars</h2><div class="g g4">${top.map(vc).join('')}</div></div>
<div class="w sec"><h2>Recommended for you</h2><div class="g g4">${rec.map(vc).join('')}</div></div>
<div class="w sec"><h2>Popular locations</h2><div class="g g3">${CITIES.map(c=>`<a class="card pad" href="#/cars" onclick="F.loc='${c}'"><h3>${c}</h3><span class="meta">${S.V.filter(v=>v.loc==c).length} cars available</span></a>`).join('')}</div></div>
<div class="w sec"><h2>Why choose DriveX</h2><div class="g g4">${[['Clear pricing','Rent, insurance, add-ons and 18% tax shown before you pay.'],['Checked fleet','Every car is serviced and cleaned before handover.'],['Flexible returns','Return at a different city branch on request.'],['Support all week','Roadside help and a phone line from 8am to 10pm.']].map(a=>`<div class="card pad"><h3 style="font-size:16px">${a[0]}</h3><p class="meta">${a[1]}</p></div>`).join('')}</div></div>
<div class="w sec"><h2>How it works</h2><div class="g g4">${['Search by city and dates','Compare cars and pick one','Add extras and pay on the demo checkout','Collect the keys at your branch'].map((t,i)=>`<div class="card pad"><b style="color:var(--ac);font:700 22px Sora">${i+1}</b><p>${t}</p></div>`).join('')}</div></div>
<div class="w sec"><h2>Customer reviews</h2><div class="g g3">${[['Aarav S.','Swift was spotless and the pickup took ten minutes.'],['Meera I.','Booked a Fortuner for a family trip. Price matched the quote exactly.'],['Kabir D.','Dropped the car at a different city and it was no trouble.']].map(r=>`<div class="card pad"><div style="color:#d97706">★★★★★</div><p>${r[1]}</p><b>${r[0]}</b><div class="meta">Demo review</div></div>`).join('')}</div></div>
<div class="w sec"><h2>Frequently asked questions</h2>${faq()}</div>`};
